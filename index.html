
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆるキャラ・アルティメット・バトル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fffaf0;
            overflow-x: hidden;
        }
        .bouncy {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* High Intensity Shake */
        @keyframes shake-heavy {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-12px, 4px); }
            40% { transform: translate(12px, -4px); }
            60% { transform: translate(-12px, -4px); }
            80% { transform: translate(12px, 4px); }
        }
        .animate-shake-heavy {
            animation: shake-heavy 0.15s ease-in-out 2;
        }

        /* Screen Shake */
        @keyframes screen-vibration {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-4px, 4px); }
            50% { transform: translate(4px, -4px); }
            75% { transform: translate(-4px, -4px); }
        }
        .animate-screen-shake {
            animation: screen-vibration 0.2s ease-in-out infinite;
        }

        @keyframes flash-red {
            0%, 100% { filter: brightness(1) sepia(0) saturate(1); }
            50% { filter: brightness(1.5) sepia(1) saturate(20) hue-rotate(-50deg); transform: scale(1.1); }
        }
        .animate-flash-red {
            animation: flash-red 0.2s ease-in-out 2;
        }

        @keyframes flash-white {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2.5); transform: scale(1.05); }
        }
        .animate-flash-white {
            animation: flash-white 0.2s ease-in-out 2;
        }

        /* Explosive Lunge with Anticipation */
        @keyframes lunge-right-explosive {
            0% { transform: translateX(0); }
            20% { transform: translateX(-20px); } /* Anticipation */
            40% { transform: translateX(70px) scale(1.2); } /* Impact */
            100% { transform: translateX(0); }
        }
        @keyframes lunge-left-explosive {
            0% { transform: translateX(0); }
            20% { transform: translateX(20px); } /* Anticipation */
            40% { transform: translateX(-70px) scale(1.2); } /* Impact */
            100% { transform: translateX(0); }
        }
        .animate-lunge-right {
            animation: lunge-right-explosive 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }
        .animate-lunge-left {
            animation: lunge-left-explosive 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>

</head>

</body>
</html>
